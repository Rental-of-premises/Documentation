openapi: 3.0.3
info:
  title: Rental of Premises API
  description: |
    API для системы аренды помещений (Office Space)
    
    ## Возможности:
    - Регистрация и аутентификация пользователей (с подтверждением email)
    - Управление помещениями (создание, редактирование, удаление)
    - Бронирование помещений по часам
    - Система отзывов и рейтингов
    - Управление профилем пользователя (имя, аватар)
    
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://team3.verstack.ru
    description: Production server

tags:
  - name: Auth
    description: Аутентификация и регистрация
  - name: Users
    description: Управление пользователями (публичные)
  - name: Account
    description: Настройки аккаунта (защищённые)
  - name: Apartments
    description: Публичные endpoints для помещений
  - name: My Apartments
    description: Управление своими помещениями (защищённые)
  - name: Bookings
    description: Бронирования
  - name: My Bookings
    description: Управление своими бронированиями (защищённые)
  - name: Reviews
    description: Отзывы о помещениях
  - name: Amenities
    description: Удобства помещений
  - name: Files
    description: Статические файлы

paths:
  # ============================================
  # AUTH
  # ============================================
  /api/auth/sign-up:
    post:
      tags: [Auth]
      summary: Регистрация пользователя
      description: Создаёт нового пользователя и отправляет письмо с подтверждением email
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Неверный запрос (валидация)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Пользователь с таким email уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/sign-in:
    post:
      tags: [Auth]
      summary: Вход в аккаунт
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход (устанавливается cookie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/confirm-email:
    get:
      tags: [Auth]
      summary: Подтверждение email по токену
      operationId: confirmEmail
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Токен подтверждения из email
      responses:
        '200':
          description: Email подтверждён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email успешно подтверждён
        '400':
          description: Неверный или истёкший токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Выход из аккаунта
      operationId: logout
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Успешный выход
        '401':
          description: Неавторизован

  /api/auth/delete:
    delete:
      tags: [Auth]
      summary: Удалить аккаунт
      operationId: deleteAccount
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Аккаунт удалён
        '401':
          description: Неавторизован
        '500':
          description: Ошибка сервера

  # ============================================
  # USERS (PUBLIC)
  # ============================================
  /api/users/{id}:
    get:
      tags: [Users]
      summary: Получить публичные данные пользователя
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '404':
          description: Пользователь не найден

  # ============================================
  # ACCOUNT (PROTECTED)
  # ============================================
  /api/account/settings/profile/change-avatar:
    post:
      tags: [Account]
      summary: Загрузить/обновить аватар
      operationId: uploadAvatar
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Изображение JPG/PNG, макс. 10MB
      responses:
        '200':
          description: Аватар загружен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  avatar:
                    type: string
                    description: URL или base64 аватара
        '400':
          description: Ошибка валидации файла
        '401':
          description: Неавторизован

  /api/account/settings/profile/change-name:
    patch:
      tags: [Account]
      summary: Изменить имя пользователя
      operationId: changeName
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 50
      responses:
        '200':
          description: Имя изменено
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  name:
                    type: string
        '400':
          description: Ошибка валидации
        '401':
          description: Неавторизован

  # ============================================
  # APARTMENTS (PUBLIC)
  # ============================================
  /api/apartments:
    get:
      tags: [Apartments]
      summary: Получить список всех активных помещений
      operationId: getApartments
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: min_price
          in: query
          schema:
            type: integer
            minimum: 0
        - name: max_price
          in: query
          schema:
            type: integer
            minimum: 0
        - name: capacity
          in: query
          schema:
            type: integer
            minimum: 1
        - name: metro
          in: query
          schema:
            type: string
        - name: amenities
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: false
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Apartment'

  /api/apartments/{id}:
    get:
      tags: [Apartments]
      summary: Получить помещение по ID
      operationId: getApartmentById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartmentDetail'
        '404':
          description: Помещение не найдено

  /api/apartments/{id}/reviews:
    get:
      tags: [Reviews]
      summary: Получить все отзывы о помещении
      operationId: getReviewsByApartment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'

  /api/apartments/{id}/calendar:
    get:
      tags: [Bookings]
      summary: Получить календарь бронирований помещения
      operationId: getBookingsByApartment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'

  /api/apartments/{id}/new-review:
    post:
      tags: [Reviews]
      summary: Создать отзыв о помещении
      description: Пользователь должен иметь завершённое бронирование этого помещения
      operationId: createReview
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Отзыв создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Ошибка валидации
        '401':
          description: Неавторизован
        '403':
          description: Нет права оставлять отзыв

  # ============================================
  # AMENITIES
  # ============================================
  /api/amenities:
    get:
      tags: [Amenities]
      summary: Получить список всех удобств
      operationId: getAmenities
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Amenity'

  /api/amenity/{id}:
    get:
      tags: [Amenities]
      summary: Получить удобство по ID
      operationId: getAmenityById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Amenity'
        '404':
          description: Удобство не найдено

  # ============================================
  # BOOKINGS (PUBLIC)
  # ============================================
  /api/bookings/{id}:
    get:
      tags: [Bookings]
      summary: Получить бронирование по ID
      operationId: getBookingById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Бронирование не найдено

  # ============================================
  # MY APARTMENTS (PROTECTED)
  # ============================================
  /api/account/my-apartments:
    get:
      tags: [My Apartments]
      summary: Получить список своих помещений
      operationId: getMyApartments
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Apartment'

  /api/account/new-apartment:
    post:
      tags: [My Apartments]
      summary: Создать новое помещение
      operationId: createApartment
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateApartmentRequest'
      responses:
        '201':
          description: Помещение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apartment'
        '400':
          description: Ошибка валидации
        '401':
          description: Неавторизован

  /api/account/apartments/{id}/edit:
    patch:
      tags: [My Apartments]
      summary: Редактировать помещение
      operationId: updateApartment
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApartmentRequest'
      responses:
        '200':
          description: Помещение обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apartment'
        '400':
          description: Ошибка валидации
        '401':
          description: Неавторизован
        '403':
          description: Нет прав на это помещение
        '404':
          description: Помещение не найдено

  /api/account/apartments/{id}/delete:
    delete:
      tags: [My Apartments]
      summary: Удалить помещение
      operationId: deleteApartment
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Помещение удалено
        '401':
          description: Неавторизован
        '403':
          description: Нет прав
        '404':
          description: Не найдено

  /api/account/apartments/{id}/upload-images:
    post:
      tags: [My Apartments]
      summary: Загрузить изображения помещения
      operationId: uploadApartmentImages
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 10
      responses:
        '200':
          description: Изображения загружены
        '400':
          description: Ошибка загрузки
        '401':
          description: Неавторизован

  /api/account/apartments/{id}/update-images:
    patch:
      tags: [My Apartments]
      summary: Обновить изображения (удалить конкретные)
      operationId: updateApartmentImages
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delete_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Изображения обновлены
        '401':
          description: Неавторизован

  /api/account/apartments/{id}/delete-images:
    delete:
      tags: [My Apartments]
      summary: Удалить все изображения помещения
      operationId: deleteAllApartmentImages
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Все изображения удалены
        '401':
          description: Неавторизован

  # ============================================
  # MY BOOKINGS (PROTECTED)
  # ============================================
  /api/account/my-bookings:
    get:
      tags: [My Bookings]
      summary: Получить свои бронирования
      operationId: getMyBookings
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'

  /api/account/new-booking:
    post:
      tags: [My Bookings]
      summary: Создать новое бронирование
      description: Создаёт бронирование со статусом 'waiting' (ожидает подтверждения владельца)
      operationId: createBooking
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Бронирование создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Ошибка валидации (пересечение с существующими)
        '401':
          description: Неавторизован

  /api/account/my-bookings/{id}/cancel:
    patch:
      tags: [My Bookings]
      summary: Отменить своё бронирование
      operationId: cancelBooking
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Бронирование отменено
        '401':
          description: Неавторизован
        '403':
          description: Нельзя отменить (уже началось или нет прав)
        '404':
          description: Не найдено

  /api/account/bookings/{id}/confirm:
    patch:
      tags: [My Bookings]
      summary: Подтвердить бронирование (для владельца помещения)
      operationId: confirmBookingBySeller
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Бронирование подтверждено
        '401':
          description: Неавторизован
        '403':
          description: Нет прав на это помещение
        '404':
          description: Не найдено

  /api/account/bookings/{id}/reject:
    patch:
      tags: [My Bookings]
      summary: Отклонить бронирование (для владельца помещения)
      operationId: rejectBookingBySeller
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Бронирование отклонено
        '401':
          description: Неавторизован
        '403':
          description: Нет прав
        '404':
          description: Не найдено

  /api/account/bookings:
    get:
      tags: [My Bookings]
      summary: Получить все бронирования своих помещений
      operationId: getBookingsForMyApartments
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'

  /api/account/delete-review/{id}:
    delete:
      tags: [Reviews]
      summary: Удалить свой отзыв
      operationId: deleteReview
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Отзыв удалён
        '401':
          description: Неавторизован
        '403':
          description: Нет прав
        '404':
          description: Не найден

  # ============================================
  # FILES (PUBLIC)
  # ============================================
  /uploads/{path}:
    get:
      tags: [Files]
      summary: Получить статический файл
      operationId: getUploadedFile
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Файл
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Файл не найден

# ============================================
# COMPONENTS
# ============================================
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: session_token
      description: Сессионная cookie для аутентификации

  schemas:
    # ---- REQUESTS ----
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Аля
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: mypassword123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    CreateApartmentRequest:
      type: object
      required: [name, address, metro, price_per_hour, capacity]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        address:
          type: string
        metro:
          type: string
        price_per_hour:
          type: integer
          minimum: 50
        capacity:
          type: integer
          minimum: 1
          maximum: 200
        amenities:
          type: array
          items:
            type: integer
        images:
          type: array
          items:
            type: string
            format: binary
          maxItems: 10

    UpdateApartmentRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        address:
          type: string
        metro:
          type: string
        price_per_hour:
          type: integer
          minimum: 50
        capacity:
          type: integer
          minimum: 1
        amenities:
          type: array
          items:
            type: integer
        is_active:
          type: boolean

    CreateBookingRequest:
      type: object
      required: [apartment_id, time_from, time_to]
      properties:
        apartment_id:
          type: integer
          format: int64
        time_from:
          type: string
          format: date-time
          description: ISO 8601, начало бронирования
          example: "2026-06-22T10:00:00Z"
        time_to:
          type: string
          format: date-time
          description: ISO 8601, конец бронирования
          example: "2026-06-22T14:00:00Z"

    CreateReviewRequest:
      type: object
      required: [stars, comment]
      properties:
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          minLength: 1
          maxLength: 1000

    # ---- RESPONSES ----
    AuthResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/UserPublic'

    UserPublic:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        avatar:
          type: object
          nullable: true
          properties:
            image_data:
              type: string
              description: Base64 или URL аватара

    Amenity:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Wi-Fi

    Apartment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        capacity:
          type: integer
        price_per_hour:
          type: integer
        metro:
          type: string
          nullable: true
        address:
          type: string
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
        images:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              image_url:
                type: string
        amenities:
          type: array
          items:
            $ref: '#/components/schemas/Amenity'
        owner_id:
          type: integer
          format: int64

    ApartmentDetail:
      allOf:
        - $ref: '#/components/schemas/Apartment'
        - type: object
          properties:
            average_rating:
              type: number
              format: float
              nullable: true
            reviews_count:
              type: integer
            owner:
              $ref: '#/components/schemas/UserPublic'

    Booking:
      type: object
      properties:
        id:
          type: integer
          format: int64
        apartment_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        time_from:
          type: string
          format: date-time
        time_to:
          type: string
          format: date-time
        status:
          type: string
          enum: [waiting, confirmed, cancelled, rejected, completed]
        price_per_hour:
          type: integer
        created_at:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        id:
          type: integer
          format: int64
        apartment_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
          example: Ошибка валидации
        message:
          type: string
